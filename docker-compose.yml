services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dso
      POSTGRES_USER: dso
      POSTGRES_PASSWORD: dso_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dso -d dso"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://web.duxorientis.com
      PAYLOAD_API_URL: http://cms:3001/api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  cms:
    build:
      context: .
      dockerfile: docker/cms.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://dso:dso_local_password@postgres:5432/dso
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-replace-with-a-long-random-secret}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cms_media:/app/media
    ports:
      - "3001:3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - cms
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  cms_media:
