# Include inside the web.duxorientis.com TLS server block.
# Payload CMS uses assetPrefix=/cms-assets to avoid colliding with the web app's Next.js chunks.
location ^~ /cms-assets/_next/static/ {
    proxy_pass http://127.0.0.1:3001/_next/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
